# Mise en ligne (01-architecture.md §9.3).
#
# Déclenché APRÈS une CI verte, jamais en parallèle d'elle : `workflow_run` est
# ce qui garantit que l'image publiée correspond à un commit dont les douze
# travaux sont passés. Un `push` direct sur `main` ne déploie rien par lui-même.
#
# L'environnement `production` porte l'approbation manuelle et les secrets. Il
# n'existe pas encore — ni VPS, ni domaine, ni clé : ce fichier est écrit pour
# le jour où ils existeront, et il est lintable dès aujourd'hui.

name: Déploiement

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette d'image à déployer (ex. sha-a1b2c3d). Vide = construire depuis main."
        required: false
        type: string

# Un seul déploiement à la fois, et surtout PAS d'annulation en cours de route :
# interrompre un `compose up` laisse le VPS dans un état que personne n'a décrit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Construire et publier l'image
  # ──────────────────────────────────────────────────────────────────────────
  image:
    name: Image
    # Un `workflow_run` se déclenche aussi quand la CI échoue : sans cette
    # garde, un `main` rouge partirait en production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.etiquette.outputs.tag }}
    steps:
      - name: Récupérer le commit exact validé par la CI
        uses: actions/checkout@v5
        with:
          # `workflow_run` place le contexte sur le commit par défaut, pas sur
          # celui qui a déclenché la CI. On le nomme explicitement.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Calculer l'étiquette
        id: etiquette
        env:
          SAISIE: ${{ inputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$SAISIE" ]; then
            tag="$SAISIE"
          else
            tag="sha-${SHA:0:7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Étiquette retenue : $tag"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: S'authentifier auprès de GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.etiquette.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Sauvegarder, basculer, vérifier
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Mise en ligne
    needs: image
    runs-on: ubuntu-latest
    # Approbation manuelle + secrets d'hôte. Tant que cet environnement n'est
    # pas créé dans les réglages du dépôt, le travail reste en attente : c'est
    # le comportement voulu, pas une panne.
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Ouvrir le tunnel SSH
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES_CONNUS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Empreinte d'hôte épinglée. Pas de `StrictHostKeyChecking=no` :
          # accepter n'importe quel hôte revient à déployer sur le premier
          # serveur qui répond à ce nom.
          printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Une sauvegarde AVANT la bascule, et le déploiement échoue si elle
      # échoue (03-donnees.md §6.6). C'est le seul moment où l'on est sûr de
      # pouvoir revenir en arrière sans perte.
      - name: Sauvegarde pré-déploiement
        env:
          HOTE: ${{ secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$UTILISATEUR@$HOTE" 'sudo /srv/feeders/bin/backup.sh'

      - name: Basculer sur la nouvelle image
        env:
          HOTE: ${{ secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          # `deploy.sh deploy` fait lui-même `compose pull`, `up -d --wait`,
          # la vérification de /readyz et le retour arrière automatique. Le
          # workflow ne réimplémente pas cette logique : elle doit rester
          # exécutable à la main, un jour de panne, sans GitHub.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$UTILISATEUR@$HOTE" "sudo /srv/feeders/bin/deploy.sh deploy '$TAG'"

      # Depuis l'extérieur, cette fois : le healthcheck interne ne dit rien de
      # Caddy, du certificat, ni du DNS.
      - name: Vérifier /readyz depuis Internet
        id: readyz
        env:
          URL_PUBLIQUE: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "${URL_PUBLIQUE%/}/readyz" > /dev/null; then
              echo "/readyz vert à la tentative $i"
              exit 0
            fi
            echo "/readyz pas encore prêt ($i/10)"
            sleep 6
          done
          echo "::error::/readyz reste rouge après 10 tentatives"
          exit 1

      - name: Retour arrière
        if: failure() && steps.readyz.outcome == 'failure'
        env:
          HOTE: ${{ secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Retour arrière d'IMAGE seulement. Les données ne sont pas
          # restaurées automatiquement : une restauration « par précaution »
          # effacerait les parties jouées depuis la sauvegarde. Si une
          # migration a été appliquée, c'est `restore.sh`, à la main, avec
          # docs/runbook/backup-restore.md sous les yeux.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$UTILISATEUR@$HOTE" 'sudo /srv/feeders/bin/deploy.sh rollback'
          echo "::error::Déploiement annulé, retour à l'étiquette précédente."
