# Surcouche de développement local. À utiliser SEULEMENT avec le fichier de
# base, et en nommant le service, pour ne pas réveiller Caddy :
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up app
#
# Ce n'est pas la boucle de développement quotidienne — celle-là, c'est
# `pnpm dev`, sans conteneur. Ce fichier sert à reproduire localement ce que le
# VPS exécutera : la vraie image, le vrai utilisateur non root, le vrai
# healthcheck. On y vient quand quelque chose marche en local et pas en ligne.

name: feeders

services:
  app:
    # On construit au lieu de tirer : en local, l'image de registre n'existe
    # pas encore et c'est justement la construction que l'on veut éprouver.
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: runtime
    image: feeders-of-runeterra:dev

    # Ici, oui : sans Caddy devant, il faut bien une porte sur l'hôte.
    ports:
      - '127.0.0.1:8787:8787'

    # Pas de `restart: unless-stopped` en local. Un conteneur qui redémarre en
    # boucle masque l'erreur de démarrage que l'on cherche à lire.
    restart: 'no'

    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # Aucune sortie réseau, aucune clé : c'est le mode dégradé volontaire du
      # port conteur (01-architecture.md §9.4).
      NARRATOR_PROVIDER: stub

    volumes:
      # Une base jetable dans l'arborescence du dépôt : `data/` est ignoré par
      # git, et `infra/data` n'entre pas dans l'image (.dockerignore).
      - ./data:/app/data
